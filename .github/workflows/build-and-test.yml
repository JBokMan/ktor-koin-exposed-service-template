name: Build And Test

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    name: Build And Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v5.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install Kotlin Toolchain CLI
        run: |
          KOTLIN_CLI_NO_MODIFY_PATH=1 curl -fsSL https://kotl.in/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Kotlin Toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/JetBrains/Kotlin
          key: kotlin-toolchain-${{ runner.os }}-${{ hashFiles('module.yaml', 'libs.versions.toml') }}
          restore-keys: |
            kotlin-toolchain-${{ runner.os }}-

      - name: Build and Test
        run: kotlin test

      - name: Show Docker status on failure
        if: failure()
        run: |
          echo "--- Docker PS ---"
          docker ps -a
          echo "--- Docker Compose Logs ---"
          docker compose logs
